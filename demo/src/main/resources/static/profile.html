<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile | EduPanel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body{font-family:'DM Sans',sans-serif;}
    .syne{font-family:'Syne',sans-serif;}
  </style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen flex">
  <aside id="sidebar" class="w-64 min-h-screen bg-stone-900 border-r border-stone-800 flex flex-col py-6 px-4"></aside>
  <main class="flex-1 p-6 space-y-6">
    <div class="bg-stone-900 border border-stone-800 rounded-2xl p-6 flex justify-between items-center">
      <div>
        <h1 class="syne text-2xl font-bold text-white">Profile</h1>
        <p class="text-stone-400 mt-1">View your account details and update password</p>
      </div>
      <div class="text-right">
        <p id="navUsername" class="text-white text-sm font-semibold syne"></p>
        <p id="navRole" class="text-stone-500 text-xs"></p>
      </div>
    </div>
    <div id="messageBox" class="hidden rounded-xl p-4 text-sm"></div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-1 bg-stone-900 border border-stone-800 rounded-2xl p-6">
        <div class="flex flex-col items-center text-center">
          <div id="avatar" class="w-24 h-24 rounded-full bg-orange-500 text-white flex items-center justify-center text-3xl font-bold syne"></div>
          <h2 id="profileUsername" class="syne text-xl font-bold mt-4"></h2>
          <span id="roleBadge" class="mt-2 inline-block px-3 py-1 rounded-full text-xs font-semibold"></span>
          <div class="mt-6 w-full text-left space-y-3 text-sm">
            <p><span class="text-stone-400">Username:</span> <span id="infoUsername" class="text-white"></span></p>
            <p><span class="text-stone-400">Email:</span> <span id="infoEmail" class="text-white"></span></p>
            <p><span class="text-stone-400">Member Since:</span> <span id="infoCreatedAt" class="text-white"></span></p>
          </div>
        </div>
      </div>
      <div class="lg:col-span-2 bg-stone-900 border border-stone-800 rounded-2xl p-6">
        <h3 class="syne text-lg font-bold text-white mb-4">Change Password</h3>
        <form onsubmit="return changePassword(event)" class="space-y-4">
          <div>
            <label class="block text-stone-300 text-xs font-semibold uppercase tracking-widest mb-2">Old Password</label>
            <input id="oldPassword" type="password" required class="w-full bg-stone-800 border border-stone-700 rounded-xl px-4 py-3 text-white text-sm"/>
          </div>
          <div>
            <label class="block text-stone-300 text-xs font-semibold uppercase tracking-widest mb-2">New Password</label>
            <input id="newPassword" type="password" required class="w-full bg-stone-800 border border-stone-700 rounded-xl px-4 py-3 text-white text-sm"/>
          </div>
          <button id="changePasswordBtn" type="submit" class="bg-orange-500 hover:bg-orange-400 text-white font-semibold px-5 py-3 rounded-xl transition">
            Update Password
          </button>
        </form>
      </div>
    </div>
  </main>
  <script>
    let currentProfile = null;
    function authHeaders(json = false){
      const headers={
        Authorization: "Bearer " + localStorage.getItem("token")
      };
      if (json) headers["Content-Type"] = "application/json";
      return headers;
    }
    function logout(){
      localStorage.clear();
      window.location.href = "index.html";
    }
    function showMessage(text, type="success"){
      const box = document.getElementById("messageBox");
      box.className = "rounded-xl p-4 text-sm";
      if (type === "success") {
        box.classList.add("bg-green-100", "text-green-800");
      } else {
        box.classList.add("bg-red-100", "text-red-800");
      }
      box.textContent = text;
      box.classList.remove("hidden");
    }
    function buildSidebar(role){
      const sidebar = document.getElementById("sidebar");
      if (role === "ADMIN"){
        sidebar.innerHTML = `
          <div class="mb-8">
            <h2 class="syne text-white text-2xl font-bold">EduPanel</h2>
            <p class="text-stone-500 text-sm mt-1">Admin Panel</p>
          </div>
          <nav class="flex flex-col gap-2 flex-1">
            <a href="admin-dashboard.html" class="px-4 py-3 rounded-xl text-stone-300 hover:bg-stone-800 transition">Dashboard</a>
            <a href="approvals.html" class="px-4 py-3 rounded-xl text-stone-300 hover:bg-stone-800 transition">Approvals</a>
            <a href="users.html" class="px-4 py-3 rounded-xl text-stone-300 hover:bg-stone-800 transition">Users</a>
            <a href="admin-student.html" class="px-4 py-3 rounded-xl text-stone-300 hover:bg-stone-800 transition">Manage Students</a>
          </nav>
          <div class="mt-6 border-t border-stone-800 pt-4">
            <p class="text-white font-semibold">${currentProfile?.username || "Admin"}</p>
            <p class="text-stone-500 text-sm">${currentProfile?.email || "-"}</p>
          </div>
          <button onclick="logout()" class="mt-4 bg-red-600 hover:bg-red-700 text-white rounded-xl px-4 py-3 transition">
            Logout
          </button>
        `;
      }else{
        sidebar.innerHTML = `
          <div class="mb-8">
            <h2 class="syne text-white text-2xl font-bold">EduPanel</h2>
            <p class="text-stone-500 text-sm mt-1">Student Panel</p>
          </div>
          <nav class="flex flex-col gap-2 flex-1">
            <a href="student-dashboard.html" class="px-4 py-3 rounded-xl text-stone-300 hover:bg-stone-800 transition">Dashboard</a>
            <a href="students.html" class="px-4 py-3 rounded-xl text-stone-300 hover:bg-stone-800 transition">View Students</a>
          </nav>
          <div class="mt-6 border-t border-stone-800 pt-4">
            <p class="text-white font-semibold">${currentProfile?.username || "Student"}</p>
            <p class="text-stone-500 text-sm">${currentProfile?.email || "-"}</p>
          </div>
          <button onclick="logout()" class="mt-4 bg-red-600 hover:bg-red-700 text-white rounded-xl px-4 py-3 transition">
            Logout
          </button>
        `;
      }
    }
    function formatDate(value){
      if (!value) return "-";
      return new Date(value).toLocaleString();
    }
    async function loadProfile(){
      const response = await fetch("/api/auth/me", {
        headers: authHeaders()
      });
      const data = await response.json();
      if(!response.ok){
        localStorage.clear();
        window.location.href = "index.html";
        return;
      }
      currentProfile = data;
      localStorage.setItem("username", data.username || "");
      localStorage.setItem("role", (data.role || "").toUpperCase());
      const role = (data.role || "").toUpperCase();
      document.getElementById("navUsername").innerText = data.username || "-";
      document.getElementById("navRole").innerText = role;
      document.getElementById("profileUsername").innerText = data.username || "-";
      document.getElementById("infoUsername").innerText = data.username || "-";
      document.getElementById("infoEmail").innerText = data.email || "-";
      document.getElementById("infoCreatedAt").innerText = formatDate(data.createdAt);
      document.getElementById("avatar").innerText = (data.username || "U").charAt(0).toUpperCase();
      const badge = document.getElementById("roleBadge");
      badge.innerText = role;
      badge.className = role === "ADMIN"
        ? "mt-2 inline-block px-3 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-800"
        : "mt-2 inline-block px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-800";
      buildSidebar(role);
    }
    async function changePassword(event){
      event.preventDefault();
      const oldPassword = document.getElementById("oldPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const button = document.getElementById("changePasswordBtn");
      button.disabled = true;
      button.innerText = "Updating...";
      try{
        const response = await fetch("/api/auth/change-password", {
          method: "PUT",
          headers: authHeaders(true),
          body: JSON.stringify({ oldPassword, newPassword })
        });
        const result = await response.json();
        if (!response.ok){
          throw new Error(result.error || result.message || "Failed to change password");
        }
        document.getElementById("oldPassword").value = "";
        document.getElementById("newPassword").value = "";
        showMessage(result.message || "Password changed successfully");
      }catch (err){
        showMessage(err.message || "Something went wrong", "error");
      }finally{
        button.disabled = false;
        button.innerText = "Update Password";
      }
      return false;
    }
    loadProfile();
  </script>
</body>
</html>
