<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Approvals | EduPanel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
  body{font-family:'DM Sans',sans-serif;margin:0;}
  .syne{font-family:'Syne',sans-serif;}
  .grain{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");opacity:0.5;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;color:#a8a29e;font-size:.875rem;font-weight:500;cursor:pointer;transition:background .18s,color .18s;font-family:'DM Sans',sans-serif;text-decoration:none;}
  .nav-item:hover{background:#1c1917;color:#e7e5e4;}
  .nav-item.active{background:#f97316;color:#fff;}
  .card{background:#1c1917;border:1px solid #292524;border-radius:16px;padding:22px;}
  </style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen flex relative overflow-x-hidden">
  <div class="grain"></div>
  <aside class="w-64 min-h-screen bg-stone-900 border-r border-stone-800 flex flex-col py-6 px-4">
    <div class="mb-8">
      <h2 class="syne text-white text-2xl font-bold">EduPanel</h2>
      <p class="text-stone-500 text-sm mt-1">Admin Panel</p>
    </div>
    <nav class="flex flex-col gap-2 flex-1">
      <a href="admin-dashboard.html" class="px-4 py-3 rounded-xl text-stone-300 hover:bg-stone-800 transition">Dashboard</a>
      <a href="approvals.html" class="px-4 py-3 rounded-xl bg-orange-500 text-white flex items-center justify-between transition">
        <span>Approvals</span>
        <span id="pendingBadge" class="bg-white/20 text-white text-xs px-2 py-0.5 rounded-full">0</span>
      </a>
      <a href="users.html" class="px-4 py-3 rounded-xl text-stone-300 hover:bg-stone-800 transition">Users</a>
      <a href="admin-student.html" class="px-4 py-3 rounded-xl text-stone-300 hover:bg-stone-800 transition">Manage Students</a>
    </nav>
    <button onclick="logout()" class="mt-6 bg-red-600 hover:bg-red-700 text-white rounded-xl px-4 py-3 transition">
      Logout
    </button>
  </aside>
  <main class="flex-1 p-6 space-y-6">
    <div class="bg-stone-900 border border-stone-800 rounded-2xl p-6 flex justify-between items-center">
      <div>
        <h1 class="syne text-2xl  font-bold text-white">Pending Approvals</h1>
        <p class="text-stone-400 mt-1">Approve or reject newly registered users</p>
      </div>
      <div class="text-sm text-stone-400">
        Logged in as <span id="adminName" class="text-orange-400 font-semibold"></span>
      </div>
    </div>
    <div id="messageBox" class="hidden rounded-xl p-4 text-sm"></div>
    <div class="bg-white rounded-2xl shadow overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm text-left">
          <thead class="bg-stone-950 text-stone-100 uppercase text-xs">
            <tr>
              <th class="px-6 py-4">#</th>
              <th class="px-6 py-4">Username</th>
              <th class="px-6 py-4">Requested Role</th>
              <th class="px-6 py-4">Date</th>
              <th class="px-6 py-4">Actions</th>
            </tr>
          </thead>
          <tbody id="approvalTableBody" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script>
    const baseUrl = "/api/admin/users";
    let pendingUsers = [];
    function requireAdmin(){
      const token = localStorage.getItem("token");
      const role = (localStorage.getItem("role") || "").toUpperCase();
      if (!token || role !== "ADMIN") {
        localStorage.clear();
        window.location.replace("index.html");
        return false;
      }
      return true;
    }
    function authHeaders(){
      return{
        Authorization: "Bearer " + localStorage.getItem("token")
      };
    }
    function logout(){
      localStorage.clear();
      window.location.href = "index.html";
    }
    function showMessage(text, type = "success"){
      const box = document.getElementById("messageBox");
      box.className = "rounded-xl p-4 text-sm";
      if (type === "success") {
        box.classList.add("bg-green-100", "text-green-800");
      } else {
        box.classList.add("bg-red-100", "text-red-800");
      }
      box.textContent = text;
      box.classList.remove("hidden");
    }
    async function safeJson(response){
      const text = await response.text();
      if(!text) return {};
      try{
        return JSON.parse(text);
      }catch{
        return {};
      }
    }
    function extractError(data, fallback){
      return data.message || data.error || fallback;
    }
    function formatRequestedRole(role){
      if (role === "PENDING_ADMIN") return "Admin";
      if (role === "PENDING_STUDENT") return "Student";
      return role || "-";
    }
    function formatDate(value){
      if (!value) return "-";
      return new Date(value).toLocaleString();
    }
    function renderPendingUsers(){
      const tbody = document.getElementById("approvalTableBody");
      tbody.innerHTML = "";
      document.getElementById("pendingBadge").textContent = pendingUsers.length;
      if (!pendingUsers.length){
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="px-6 py-8 text-center text-gray-500">No pending users found</td>
          </tr>
        `;
        return;
      }
      pendingUsers.forEach((user, index) =>{
        const zebra = index % 2 === 0 ? "bg-white" : "bg-gray-50";
        tbody.innerHTML += `
          <tr class="${zebra} hover:bg-blue-50 transition">
            <td class="px-6 py-4">${index + 1}</td>
            <td class="px-6 py-4 font-medium text-gray-800">${user.username ?? "-"}</td>
            <td class="px-6 py-4">${formatRequestedRole(user.role)}</td>
            <td class="px-6 py-4">${formatDate(user.createdAt)}</td>
            <td class="px-6 py-4">
              <div class="flex gap-2">
                <button onclick="approveUser('${user.id}')" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">
                  Approve
                </button>
                <button onclick="rejectUser('${user.id}')" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">
                  Reject
                </button>
              </div>
            </td>
          </tr>
        `;
      });
    }
    async function loadPendingUsers(){
      const response = await fetch(baseUrl, { headers: authHeaders() });
      const data = await safeJson(response);
      if (!response.ok){
        showMessage(extractError(data, "Failed to load users"), "error");
        return;
      }
      pendingUsers = (Array.isArray(data) ? data : []).filter(
        user => (user.role || "").startsWith("PENDING")
      );
      renderPendingUsers();
    }
    async function approveUser(id){
      const response = await fetch(`${baseUrl}/${id}/approve`, {
        method: "PUT",
        headers: authHeaders()
      });
      const data = await safeJson(response);
      if (!response.ok){
        showMessage(extractError(data, "Failed to approve user"), "error");
        return;
      }
      pendingUsers = pendingUsers.filter(user => user.id !== id);
      renderPendingUsers();
      showMessage("User approved successfully");
    }
    async function rejectUser(id){
      const confirmed = confirm("Are you sure you want to reject this user?");
      if (!confirmed) return;
      const response = await fetch(`${baseUrl}/${id}/reject`,{
        method: "DELETE",
        headers: authHeaders()
      });
      if (!response.ok && response.status !== 204){
        const data = await safeJson(response);
        showMessage(extractError(data, "Failed to reject user"), "error");
        return;
      }
      pendingUsers = pendingUsers.filter(user => user.id !== id);
      renderPendingUsers();
      showMessage("User rejected successfully");
    }
    if (requireAdmin()){
      document.getElementById("adminName").textContent = localStorage.getItem("username") || "Admin";
      loadPendingUsers();
    }
  </script>
</body>
</html>
