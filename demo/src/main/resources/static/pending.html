<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pending Approval | EduPanel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body{font-family:'DM Sans',sans-serif;}
    .syne{font-family:'Syne',sans-serif;}
  </style>
</head>
<body class="min-h-screen bg-stone-950 flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-stone-900 border border-stone-800 rounded-2xl p-8 shadow-2xl text-center">
    <div class="inline-flex items-center justify-center w-14 h-14 bg-yellow-500 rounded-xl mb-5">
      <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M10.29 3.86l-7.5 13A1 1 0 003.67 18h16.66a1 1 0 00.88-1.5l-7.5-13a1 1 0 00-1.76 0z"/>
      </svg>
    </div>
    <h1 class="syne text-white text-2xl font-bold">Approval Pending</h1>
    <p class="text-stone-400 mt-3">Your account is awaiting admin approval.</p>
    <p id="pendingUserText" class="text-stone-500 text-sm mt-2"></p>
    <div class="mt-6">
      <a href="index.html" class="inline-block bg-orange-500 hover:bg-orange-400 text-white font-semibold px-5 py-3 rounded-xl transition">
        Back to Login
      </a>
    </div>
  </div>
  <script>
    const pendingUsername = localStorage.getItem("pendingUsername");
    if (pendingUsername) {
      document.getElementById("pendingUserText").textContent = `Username: ${pendingUsername}`;
    }
  </script>
</body>
</html>
