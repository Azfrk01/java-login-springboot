<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'DM Sans', sans-serif; margin: 0; }
    .syne { font-family: 'Syne', sans-serif; }

    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.5;
    }

    .fade-in { animation: fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .d1{animation-delay:.05s}.d2{animation-delay:.12s}
    .d3{animation-delay:.19s}.d4{animation-delay:.26s}
    .d5{animation-delay:.33s}

    .nav-item {
      display:flex; align-items:center; gap:10px;
      padding:10px 14px; border-radius:12px;
      color:#a8a29e; font-size:.875rem; font-weight:500;
      cursor:pointer; transition:background .18s, color .18s;
      font-family:'DM Sans',sans-serif;
    }
    .nav-item:hover { background:#1c1917; color:#e7e5e4; }
    .nav-item.active { background:#f97316; color:#fff; }

    .card {
      background:#1c1917; border:1px solid #292524;
      border-radius:16px; padding:22px;
      transition:transform .18s, box-shadow .18s;
    }
    .card:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,0,0,.35); }

    .btn-primary {
      background:#f97316; color:#fff;
      font-family:'Syne',sans-serif; font-weight:600;
      border-radius:12px; padding:10px 20px; font-size:.875rem;
      transition:transform .15s, box-shadow .15s, background .2s;
      cursor:pointer; border:none;
    }
    .btn-primary:hover { background:#ea6c0a; transform:translateY(-1px); box-shadow:0 6px 20px rgba(249,115,22,.3); }

    .btn-ghost {
      background:transparent; color:#a8a29e;
      font-family:'Syne',sans-serif; font-weight:600;
      border-radius:12px; padding:10px 20px; font-size:.875rem;
      border:1px solid #292524; transition:background .18s, color .18s;
      cursor:pointer;
    }
    .btn-ghost:hover { background:#1c1917; color:#e7e5e4; }

    /* Profile dropdown */
    .dropdown { display:none; }
    .dropdown.open { display:block; }

    /* Modal */
    .modal-bg { display:none; }
    .modal-bg.open { display:flex; }

    .pulse-dot {
      width:8px; height:8px; border-radius:50%; background:#22c55e;
      animation:pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100%{ box-shadow:0 0 0 0 rgba(34,197,94,.4); }
      50%{ box-shadow:0 0 0 5px rgba(34,197,94,0); }
    }

    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#292524; border-radius:99px; }
  </style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen flex relative overflow-x-hidden">

<div class="grain"></div>

<!-- ── SIDEBAR ─────────────────────────────────── -->
<aside class="w-56 min-h-screen bg-stone-900 border-r border-stone-800 flex flex-col py-6 px-3 gap-1 z-10 flex-shrink-0">

  <!-- Brand -->
  <div class="flex items-center gap-3 px-3 mb-6">
    <div class="w-9 h-9 bg-orange-500 rounded-xl flex items-center justify-center flex-shrink-0">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
      </svg>
    </div>
    <span class="syne text-white font-bold text-lg tracking-tight">EduPanel</span>
  </div>

  <!-- Nav -->
  <nav class="flex flex-col gap-1 flex-1">
    <div class="nav-item active" onclick="setActive(this)">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </div>
    <div class="nav-item" onclick="openStudents()">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      Students
    </div>
    <div class="nav-item" onclick="setActive(this)">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      Assignments
    </div>
    <div class="nav-item" onclick="setActive(this)">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      Schedule
    </div>
    <div class="nav-item" onclick="setActive(this)">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      Results
    </div>

    <div class="my-3 border-t border-stone-800"></div>

    <div class="nav-item" onclick="setActive(this)">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
      Settings
    </div>
  </nav>

  <!-- Logout -->
  <button onclick="confirmLogout()" class="nav-item w-full text-left text-red-400 hover:bg-red-500/10 hover:text-red-300 mt-2">
    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    Logout
  </button>
</aside>

<!-- ── MAIN ─────────────────────────────────────── -->
<main class="flex-1 flex flex-col min-w-0 relative z-10">

  <!-- Topbar -->
  <header class="sticky top-0 z-20 bg-stone-950/80 backdrop-blur border-b border-stone-800/60 px-6 py-4 flex items-center gap-4">
    <div class="flex-1">
      <h2 class="syne text-white font-bold text-lg leading-tight">Dashboard</h2>
      <p class="text-stone-500 text-xs">Sunday, March 08 · 2026</p>
    </div>

    <!-- Profile button -->
    <div class="relative">
      <button onclick="toggleProfile()" class="flex items-center gap-2.5 bg-stone-900 border border-stone-800 rounded-xl px-3 py-2 hover:border-orange-500/50 transition-colors">
        <div class="relative">
          <div id="avatarLetter" class="w-7 h-7 rounded-full bg-orange-500 flex items-center justify-center text-white text-xs font-bold syne"></div>
          <div class="pulse-dot absolute -bottom-0.5 -right-0.5 border-2 border-stone-900"></div>
        </div>
        <div class="text-left hidden sm:block">
          <p id="navUsername" class="text-white text-xs font-semibold syne leading-tight"></p>
          <p class="text-stone-500 text-xs leading-tight">Admin</p>
        </div>
        <svg class="w-3.5 h-3.5 text-stone-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </button>

      <!-- Dropdown -->
      <div id="profileDropdown" class="dropdown absolute right-0 top-full mt-2 w-52 bg-stone-900 border border-stone-800 rounded-xl shadow-2xl overflow-hidden z-50">
        <!-- Profile header -->
        <div class="px-4 py-3 border-b border-stone-800">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-orange-500 flex items-center justify-center text-white font-bold syne">J</div>
            <div>
              <p id="dropdownUsername" class="text-white text-sm font-semibold syne"></p>
              <p id="dropdownEmail" class="text-stone-400 text-xs"></p>
            </div>
          </div>
        </div>
        <div class="py-1">
          <button onclick="openProfileModal()" class="w-full flex items-center gap-3 px-4 py-2.5 text-stone-300 hover:bg-stone-800 hover:text-white transition-colors text-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            View Profile
          </button>
          <button onclick="setActive(document.querySelector('.nav-item:last-child'))" class="w-full flex items-center gap-3 px-4 py-2.5 text-stone-300 hover:bg-stone-800 hover:text-white transition-colors text-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
            Settings
          </button>
          <div class="border-t border-stone-800 my-1"></div>
          <button onclick="confirmLogout()" class="w-full flex items-center gap-3 px-4 py-2.5 text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-colors text-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Content -->
  <div class="p-6 space-y-6 overflow-y-auto">

    <!-- Welcome banner -->
    <div class="fade-in d1 relative bg-stone-900 border border-stone-800 rounded-2xl px-6 py-5 flex items-center justify-between overflow-hidden">
      <div class="absolute right-0 top-0 w-48 h-full bg-orange-500/5 blur-2xl pointer-events-none"></div>
      <div>
        <p class="text-stone-400 text-sm">Good morning,</p>
        <h3 class="syne text-white text-xl font-bold mt-0.5">
        <span id="welcomeUsername"></span> 👋
        </h3>
      </div>
      <button onclick="openStudents()" class="btn-primary hidden sm:block">
        Manage Students
      </button>
    </div>
<!-- ── MANAGE STUDENTS MODAL ────────────────────── -->
<div id="studentsModal" class="modal-bg fixed inset-0 bg-black/70 backdrop-blur-sm z-50 items-center justify-center p-4">
  <div class="bg-stone-900 border border-stone-800 rounded-2xl w-full max-w-lg shadow-2xl" style="animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both">
    <div class="flex items-center justify-between px-6 py-5 border-b border-stone-800">
      <div>
        <h3 class="syne text-white font-bold text-lg">Manage Students</h3>
        <p class="text-stone-500 text-xs mt-0.5">Add, edit or remove students</p>
      </div>
      <button onclick="closeModal('studentsModal')" class="text-stone-500 hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="p-6 space-y-3">
      <button class="w-full flex items-center gap-4 p-4 bg-stone-800/60 hover:bg-stone-800 rounded-xl transition-colors text-left group">
        <div class="w-10 h-10 bg-orange-500/10 rounded-xl flex items-center justify-center group-hover:bg-orange-500/20 transition-colors">
          <svg class="w-5 h-5 text-orange-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        </div>
        <div>
          <p class="text-white text-sm font-semibold syne">Add Student</p>
          <p class="text-stone-500 text-xs">Enroll a new student</p>
        </div>
      </button>
      <button class="w-full flex items-center gap-4 p-4 bg-stone-800/60 hover:bg-stone-800 rounded-xl transition-colors text-left group">
        <div class="w-10 h-10 bg-blue-500/10 rounded-xl flex items-center justify-center group-hover:bg-blue-500/20 transition-colors">
          <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
        </div>
        <div>
          <p class="text-white text-sm font-semibold syne">View All Students</p>
          <p class="text-stone-500 text-xs">Browse & search student list</p>
        </div>
      </button>
      <button class="w-full flex items-center gap-4 p-4 bg-stone-800/60 hover:bg-stone-800 rounded-xl transition-colors text-left group">
        <div class="w-10 h-10 bg-green-500/10 rounded-xl flex items-center justify-center group-hover:bg-green-500/20 transition-colors">
          <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        </div>
        <div>
          <p class="text-white text-sm font-semibold syne">Edit Records</p>
          <p class="text-stone-500 text-xs">Update student information</p>
        </div>
      </button>
    </div>
  </div>
</div>

<!-- ── PROFILE MODAL ─────────────────────────────── -->
<div id="profileModal" class="modal-bg fixed inset-0 bg-black/70 backdrop-blur-sm z-50 items-center justify-center p-4">
  <div class="bg-stone-900 border border-stone-800 rounded-2xl w-full max-w-sm shadow-2xl" style="animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both">
    <div class="flex items-center justify-between px-6 py-5 border-b border-stone-800">
      <h3 class="syne text-white font-bold text-lg">My Profile</h3>
      <button onclick="closeModal('profileModal')" class="text-stone-500 hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="p-6">
      <div class="flex flex-col items-center mb-6">
        <div class="w-16 h-16 rounded-full bg-orange-500 flex items-center justify-center text-white text-2xl font-bold syne mb-3" style="box-shadow:0 0 0 3px #f97316,0 0 0 6px #292524">J</div>
        <p id="profileUsername" class="syne text-white font-bold text-lg"></p>
        <p class="text-stone-400 text-sm">Administrator</p>
      </div>
      <div class="space-y-3">
        <div class="flex items-center gap-3 bg-stone-800/60 rounded-xl px-4 py-3">
          <svg class="w-4 h-4 text-orange-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span id="profileEmail" class="text-stone-300 text-sm"></span>
        </div>
        <div class="flex items-center gap-3 bg-stone-800/60 rounded-xl px-4 py-3">
          <svg class="w-4 h-4 text-orange-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
          <span class="text-stone-300 text-sm">+91 98765 43210</span>
        </div>
        <div class="flex items-center gap-3 bg-stone-800/60 rounded-xl px-4 py-3">
          <svg class="w-4 h-4 text-orange-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
          <span class="text-stone-300 text-sm">EduPanel School, Ludhiana</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── LOGOUT CONFIRM ────────────────────────────── -->
<div id="logoutModal" class="modal-bg fixed inset-0 bg-black/70 backdrop-blur-sm z-50 items-center justify-center p-4">
  <div class="bg-stone-900 border border-stone-800 rounded-2xl w-full max-w-xs shadow-2xl text-center p-6" style="animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both">
    <div class="w-12 h-12 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-6 h-6 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    </div>
    <h3 class="syne text-white font-bold text-lg mb-1">Logout?</h3>
    <p class="text-stone-400 text-sm mb-6">You'll be signed out of your account.</p>
    <div class="flex gap-3">
      <button onclick="closeModal('logoutModal')" class="btn-ghost flex-1">Cancel</button>
      <button onclick="logout()" class="flex-1 bg-red-500 hover:bg-red-600 text-white syne font-semibold rounded-xl py-2.5 text-sm transition-colors">
  Logout
</button>
    </div>
  </div>
</div>

<script>
	function logout(){
   	 localStorage.removeItem("token");
    	window.location.href = "index.html";
	}
	function openStudents() {
    	window.location.href = "student.html";
	}
  function setActive(el) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
  }

  function toggleProfile() {
    const d = document.getElementById('profileDropdown');
    d.classList.toggle('open');
  }

  document.addEventListener('click', e => {
    const d = document.getElementById('profileDropdown');
    if (!e.target.closest('.relative') && d.classList.contains('open')) {
      d.classList.remove('open');
    }
  });

  function openProfileModal() {
    document.getElementById('profileDropdown').classList.remove('open');
    document.getElementById('profileModal').classList.add('open');
  }

  function confirmLogout() {
    document.getElementById('profileDropdown').classList.remove('open');
    document.getElementById('logoutModal').classList.add('open');
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  // Close modals on backdrop click
  ['studentsModal','profileModal','logoutModal'].forEach(id => {
    document.getElementById(id).addEventListener('click', function(e) {
      if (e.target === this) closeModal(id);
    });
  });
  document.addEventListener("DOMContentLoaded", function () {

  const username = localStorage.getItem("username");

  if (!username) {
    window.location.href = "index.html";
    return;
  }

  const nav = document.getElementById("navUsername");
  const dropdown = document.getElementById("dropdownUsername");
  const welcome = document.getElementById("welcomeUsername");
  const profile = document.getElementById("profileUsername");
  const avatar = document.getElementById("avatarLetter");

  if(nav) nav.textContent = username;
  if(dropdown) dropdown.textContent = username;
  if(welcome) welcome.textContent = username;
  if(profile) profile.textContent = username;

  if(avatar) avatar.textContent = username.charAt(0).toUpperCase();

});
</script>

</body>
</html>
