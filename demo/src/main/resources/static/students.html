<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body class="bg-gray-100 min-h-screen" style="font-family:'DM Sans',sans-serif; margin:0; background:#0c0a09; color:#f5f5f4;">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-slate-800 text-white flex flex-col p-5" style="background:#1c1917; border-right:1px solid #292524;">
      <h2 class="text-2xl font-bold mb-8" style="font-family:'Syne',sans-serif; color:#ffffff; letter-spacing:-0.02em;">Student Panel</h2>
      <nav class="flex flex-col gap-3 flex-1">
        <a href="student-dashboard.html" class="p-3 rounded hover:bg-slate-700 transition" style="text-decoration:none; color:#a8a29e; border-radius:12px; transition:background .18s,color .18s;">Dashboard</a>
        <a href="students.html" class="bg-slate-700 p-3 rounded transition" style="text-decoration:none; background:#f97316; color:#ffffff; border-radius:12px; transition:background .18s,color .18s;">View Students</a>
      </nav>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-700 transition p-3 rounded mt-6" style="background:transparent; color:#f87171; border:0; text-align:left; border-radius:12px; transition:background .18s,color .18s; cursor:pointer;">Logout</button>
    </aside>

    <main class="flex-1 p-6 space-y-6" style="background:transparent;">
      <div class="bg-white rounded-xl shadow p-6 flex justify-between items-center" style="background:#1c1917; border:1px solid #292524; border-radius:16px; box-shadow:none;">
        <div>
          <h1 class="text-2xl font-bold text-gray-800" style="font-family:'Syne',sans-serif; color:#ffffff;">Student Directory</h1>
          <p class="text-gray-500 mt-1" style="color:#78716c;">Read-only student listing</p>
        </div>
        <div class="text-sm text-gray-600" style="color:#a8a29e;">
          Logged in as <span id="studentName" class="font-semibold text-blue-600" style="font-family:'Syne',sans-serif; color:#f97316;"></span>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow p-6" style="background:#1c1917; border:1px solid #292524; border-radius:16px; box-shadow:none;">
        <div class="flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
          <div class="flex gap-3 w-full md:w-auto">
            <input
              id="searchInput"
              type="text"
              placeholder="Search by student name"
              class="border rounded-lg px-4 py-2 w-full md:w-80"
              onkeydown="handleSearchEnter(event)"
              style="background:#0f0c0a; border:1px solid #292524; color:#f5f5f4; border-radius:12px;"
            />
            <button onclick="searchStudents()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700" style="background:#f97316; color:#fff; font-family:'Syne',sans-serif; font-weight:600; border-radius:12px; padding:10px 20px; font-size:.875rem; cursor:pointer; border:none;">
              Search
            </button>
            <button onclick="clearSearch()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600" style="background:transparent; color:#a8a29e; font-family:'Syne',sans-serif; font-weight:600; border-radius:12px; padding:10px 20px; font-size:.875rem; border:1px solid #292524; cursor:pointer;">
              Clear
            </button>
          </div>

          <div id="summaryText" class="text-sm text-gray-600" style="color:#a8a29e;"></div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow overflow-hidden" style="background:#1c1917; border:1px solid #292524; border-radius:16px; box-shadow:none;">
        <div class="overflow-x-auto">
          <table class="min-w-full text-sm text-left" style="color:#d6d3d1;">
            <thead class="bg-gray-100 text-gray-700 uppercase text-xs" style="background:#14110f; color:#f5f5f4;">
              <tr>
                <th class="px-6 py-4">#</th>
                <th class="px-6 py-4">Name</th>
                <th class="px-6 py-4">Branch</th>
                <th class="px-6 py-4">Year</th>
                <th class="px-6 py-4">Email</th>
                <th class="px-6 py-4">CGPA</th>
              </tr>
            </thead>
            <tbody id="studentTableBody" class="divide-y divide-gray-200" style="border-top:1px solid #292524;"></tbody>
          </table>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3" style="background:#1c1917; border:1px solid #292524; border-radius:16px; box-shadow:none;">
        <div id="pageInfo" class="text-sm text-gray-600" style="color:#a8a29e;">Page 1 of 1</div>
        <div class="flex gap-3">
          <button id="prevBtn" onclick="prevPage()" class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 disabled:opacity-50" style="background:#0f0c0a; color:#e7e5e4; border:1px solid #292524; border-radius:12px;">
            Previous
          </button>
          <button id="nextBtn" onclick="nextPage()" class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 disabled:opacity-50" style="background:#0f0c0a; color:#e7e5e4; border:1px solid #292524; border-radius:12px;">
            Next
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const baseUrl = "/api/students";
    let currentPage = 0;
    let pageSize = 10;
    let totalPages = 1;
    let totalElements = 0;
    let currentSearch = "";

    function requireRole(role) {
      const token = localStorage.getItem("token");
      const storedRole = (localStorage.getItem("role") || "").toUpperCase();
      if (!token || storedRole !== role) {
        localStorage.clear();
        window.location.replace("index.html");
        return false;
      }
      return true;
    }

    function logout() {
      localStorage.clear();
      window.location.href = "index.html";
    }

    function authHeaders() {
      return {
        Authorization: "Bearer " + localStorage.getItem("token")
      };
    }

    async function loadStudents() {
      const response = await fetch(`${baseUrl}?page=${currentPage}&size=${pageSize}`, {
        headers: authHeaders()
      });
      const data = await safeJson(response);

      if (!response.ok) return;

      const students = data.content || [];
      totalPages = data.totalPages || 1;
      totalElements = data.totalElements || 0;

      renderTable(students, true);
      updatePaginationInfo(students.length);
    }

    async function searchStudents() {
      const query = document.getElementById("searchInput").value.trim();
      currentSearch = query;

      if (!query) {
        currentPage = 0;
        loadStudents();
        return;
      }

      const response = await fetch(`${baseUrl}/search?name=${encodeURIComponent(query)}`, {
        headers: authHeaders()
      });
      const data = await safeJson(response);

      if (!response.ok) return;

      const students = Array.isArray(data) ? data : [];
      renderTable(students, false);

      totalPages = 1;
      totalElements = students.length;

      document.getElementById("pageInfo").textContent = "Search results";
      document.getElementById("summaryText").textContent = `Showing ${students.length} result(s) for "${query}"`;
      document.getElementById("prevBtn").disabled = true;
      document.getElementById("nextBtn").disabled = true;
    }

    function clearSearch() {
      document.getElementById("searchInput").value = "";
      currentSearch = "";
      currentPage = 0;
      loadStudents();
    }

    function handleSearchEnter(event) {
      if (event.key === "Enter") searchStudents();
    }

    function renderTable(students, paginated) {
      const tbody = document.getElementById("studentTableBody");
      tbody.innerHTML = "";

      if (!students.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="px-6 py-8 text-center text-gray-500" style="color:#78716c; background:#1c1917;">No students found</td>
          </tr>
        `;
        return;
      }

      students.forEach((student, index) => {
        const serialNumber = paginated ? currentPage * pageSize + index + 1 : index + 1;
        const rowClass = index % 2 === 0 ? "bg-white" : "bg-gray-50";

        tbody.innerHTML += `
          <tr class="${rowClass} hover:bg-blue-50 transition" style="background:#1c1917; border-top:1px solid #292524;">
            <td class="px-6 py-4" style="color:#d6d3d1;">${serialNumber}</td>
            <td class="px-6 py-4 font-medium text-gray-800" style="color:#ffffff;">${student.name ?? "-"}</td>
            <td class="px-6 py-4" style="color:#d6d3d1;">${student.branch ?? "-"}</td>
            <td class="px-6 py-4" style="color:#d6d3d1;">${student.year ?? "-"}</td>
            <td class="px-6 py-4" style="color:#d6d3d1;">${student.email ?? "-"}</td>
            <td class="px-6 py-4" style="color:#d6d3d1;">${student.cgpa ?? "-"}</td>
          </tr>
        `;
      });
    }

    function updatePaginationInfo(currentCount) {
      const start = totalElements === 0 ? 0 : currentPage * pageSize + 1;
      const end = totalElements === 0 ? 0 : start + currentCount - 1;

      document.getElementById("pageInfo").textContent = `Page ${currentPage + 1} of ${totalPages}`;
      document.getElementById("summaryText").textContent = `Showing ${start}-${end} of ${totalElements} students`;

      document.getElementById("prevBtn").disabled = currentPage === 0;
      document.getElementById("nextBtn").disabled = currentPage >= totalPages - 1;
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        loadStudents();
      }
    }

    function nextPage() {
      if (currentPage < totalPages - 1) {
        currentPage++;
        loadStudents();
      }
    }

    async function safeJson(response) {
      const text = await response.text();
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch {
        return text;
      }
    }

    if (requireRole("STUDENT")) {
      document.getElementById("studentName").textContent = localStorage.getItem("username") || "Student";
      loadStudents();
    }
  </script>
</body>
</html>
