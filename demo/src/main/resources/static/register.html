<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | EduPanel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body{font-family:'DM Sans',sans-serif;}
    h1,h2,label,.btn-label{font-family:'Syne',sans-serif;}
    .grain{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");opacity:0.4;}
    .card{animation:slideUp .6s cubic-bezier(.16,1,.3,1) both;}
    @keyframes slideUp{from{opacity:0;transform:translateY(32px);}to{opacity:1;transform:translateY(0);}}
    .input-field{transition:border-color .2s,box-shadow .2s;}
    .input-field:focus{outline:none;border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.15);}
    .btn-register{transition:transform .15s,box-shadow .15s,background .2s;}
    .btn-register:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(249,115,22,.35);}
    .btn-login{transition:background .2s,color .2s,transform .15s;}
    .btn-login:hover{background:#1c1917;color:#fdba74;transform:translateY(-1px);}
    .error{color:#f87171;font-size:13px;margin-top:6px;}
    .success{color:#34d399;font-size:13px;margin-top:6px;}
  </style>
</head>
<body class="min-h-screen bg-stone-950 flex items-center justify-center px-4 relative overflow-hidden">
  <div class="grain"></div>
  <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-orange-500 rounded-full blur-[140px] opacity-10 pointer-events-none"></div>
  <div class="card relative z-10 w-full max-w-sm bg-stone-900 border border-stone-800 rounded-2xl p-8 shadow-2xl">
    <div class="mb-8 text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-orange-500 rounded-xl mb-4">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
      </div>
      <h1 class="text-white text-2xl font-bold tracking-tight">Create Account</h1>
      <p class="text-stone-400 text-sm mt-1 font-light">New accounts require admin approval</p>
    </div>

    <form class="space-y-5" onsubmit="return registerUser(event)">
      <div>
        <label class="block text-stone-300 text-xs font-semibold uppercase tracking-widest mb-2">Username</label>
        <input id="username" type="text" placeholder="Choose a username" required class="input-field w-full bg-stone-800 border border-stone-700 rounded-xl px-4 py-3 text-white placeholder-stone-500 text-sm" />
      </div>
      <div>
        <label class="block text-stone-300 text-xs font-semibold uppercase tracking-widest mb-2">Email</label>
        <input id="email" type="email" placeholder="Enter your email" required class="input-field w-full bg-stone-800 border border-stone-700 rounded-xl px-4 py-3 text-white placeholder-stone-500 text-sm"/>
      </div>
      <div>
        <label class="block text-stone-300 text-xs font-semibold uppercase tracking-widest mb-2">Password</label>
        <input id="password" type="password" placeholder="Create a password" required minlength="4" class="input-field w-full bg-stone-800 border border-stone-700 rounded-xl px-4 py-3 text-white placeholder-stone-500 text-sm" />
      </div>
      <div>
        <label class="block text-stone-300 text-xs font-semibold uppercase tracking-widest mb-2">Register As</label>
        <select id="role" class="input-field w-full bg-stone-800 border border-stone-700 rounded-xl px-4 py-3 text-white text-sm">
        <option value="STUDENT">Student</option>
        <option value="ADMIN">Admin</option>
        </select>
      </div>
      <p id="message" class="error"></p>
      <button id="registerBtn" type="submit" class="btn-register btn-label w-full bg-orange-500 hover:bg-orange-400 text-white font-semibold rounded-xl py-3 text-sm tracking-wide mt-2">
        Register
      </button>
      <div class="flex items-center gap-3 my-1">
        <div class="flex-1 h-px bg-stone-800"></div>
        <span class="text-stone-600 text-xs">already have an account?</span>
        <div class="flex-1 h-px bg-stone-800"></div>
      </div>
      <button type="button" onclick="goToLogin()" class="btn-login btn-label w-full border border-stone-700 text-stone-300 font-semibold rounded-xl py-3 text-sm tracking-wide">
        Back to Login
      </button>
    </form>
  </div>
  <script>
    function setMessage(text, type = 'error') {
      const el = document.getElementById('message');
      el.className = type === 'success' ? 'success' : 'error';
      el.innerText = text;
    }

    async function registerUser(e){
      e.preventDefault();
      setMessage('');

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const registerBtn = document.getElementById('registerBtn');

      registerBtn.disabled = true;
      registerBtn.innerText = 'Registering...';
      const role = document.getElementById('role').value;
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, email, password, role })
        });
        let result = {};
        try { result = await response.json(); } catch (_) { result = {}; }
        if (!response.ok) {
          throw new Error(result.message || result.error || 'Registration failed.');
        }
        setMessage('Registration submitted. Your account is awaiting admin approval.', 'success');
        localStorage.setItem('pendingUsername', username);
        setTimeout(() => window.location.href = 'pending.html', 1200);
      } catch (err) {
        setMessage(err.message || 'Something went wrong during registration.');
      } finally {
        registerBtn.disabled = false;
        registerBtn.innerText = 'Register';
      }

      return false;
    }

    function goToLogin(){
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
