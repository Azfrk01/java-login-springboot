<!-- src/main/resources/static/register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register | MyApp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-container">
    <form class="login-box" onsubmit="return register(event)">
      <h2>Create Account</h2>
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Register</button>
      <p id="error-msg" class="error"></p>
      <button type="button" onclick="goToLogin()">Back to Login</button>
    </form>
  </div>
  <script>
    async function register(e){
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try{
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        if(response.ok){
        alert("Registration successful!");
        } else {
          document.getElementById("error-msg").innerText ="Registration failed. Try again.";
        }
      } catch (err) {
        console.error(err);
        document.getElementById("error-msg").innerText ="Something went wrong. Try again.";
      }
    }
  </script>

  <script>
    function goToLogin(){
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
