<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Students</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-gray-900 text-white p-5 flex flex-col">
      <h2 class="text-2xl font-bold mb-8">Admin Panel</h2>
      <nav class="flex flex-col gap-3 flex-1">
        <a href="admin-dashboard.html" class="p-3 rounded hover:bg-gray-800 transition">Dashboard</a>
        <a href="admin-students.html" class="p-3 rounded bg-gray-800 transition">Manage Students</a>
      </nav>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-700 p-3 rounded mt-6">Logout</button>
    </aside>

    <main class="flex-1 p-6 space-y-6">
      <div class="bg-white rounded-xl shadow p-6 flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">Student Directory</h1>
          <p class="text-gray-500 mt-1">Admin table with search, pagination, edit and delete</p>
        </div>
        <div class="text-sm text-gray-600">
          Logged in as <span id="adminName" class="font-semibold text-blue-600"></span>
        </div>
      </div>

      <!-- Form -->
      <div class="bg-white rounded-xl shadow p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-semibold text-gray-800">Student Form</h2>
          <button onclick="resetForm()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Clear</button>
        </div>

        <input type="hidden" id="studentId" />

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <input id="name" type="text" placeholder="Full Name" class="border rounded-lg px-4 py-2 w-full">
          <input id="branch" type="text" placeholder="Branch" class="border rounded-lg px-4 py-2 w-full">
          <input id="year" type="number" min="1" max="4" placeholder="Year" class="border rounded-lg px-4 py-2 w-full">
          <input id="email" type="email" placeholder="Email" class="border rounded-lg px-4 py-2 w-full">
          <input id="cgpa" type="number" min="0" max="10" step="0.01" placeholder="CGPA" class="border rounded-lg px-4 py-2 w-full">
          <input id="phone" type="text" placeholder="Phone" class="border rounded-lg px-4 py-2 w-full">
        </div>

        <div class="mt-4 flex gap-3">
          <button id="saveBtn" onclick="saveStudent()" class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700">
            Add Student
          </button>
          <button onclick="resetForm()" class="bg-gray-500 text-white px-5 py-2 rounded-lg hover:bg-gray-600">
            Cancel Edit
          </button>
        </div>
      </div>

      <!-- Search -->
      <div class="bg-white rounded-xl shadow p-6">
        <div class="flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
          <div class="flex gap-3 w-full md:w-auto">
            <input
              id="searchInput"
              type="text"
              placeholder="Search by student name"
              class="border rounded-lg px-4 py-2 w-full md:w-80"
              onkeydown="handleSearchEnter(event)"
            />
            <button onclick="searchStudents()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
              Search
            </button>
            <button onclick="clearSearch()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600">
              Clear
            </button>
          </div>

          <div id="summaryText" class="text-sm text-gray-600"></div>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl shadow overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full text-sm text-left">
            <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
              <tr>
                <th class="px-6 py-4">#</th>
                <th class="px-6 py-4">Name</th>
                <th class="px-6 py-4">Branch</th>
                <th class="px-6 py-4">Year</th>
                <th class="px-6 py-4">Email</th>
                <th class="px-6 py-4">CGPA</th>
                <th class="px-6 py-4">Actions</th>
              </tr>
            </thead>
            <tbody id="studentTableBody" class="divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>

      <!-- Pagination -->
      <div class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div id="pageInfo" class="text-sm text-gray-600">Page 1 of 1</div>
        <div class="flex gap-3">
          <button id="prevBtn" onclick="prevPage()" class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 disabled:opacity-50">
            Previous
          </button>
          <button id="nextBtn" onclick="nextPage()" class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 disabled:opacity-50">
            Next
          </button>
        </div>
      </div>

      <div id="messageBox" class="hidden rounded-lg p-4 text-sm"></div>
    </main>
  </div>

  <script>
    const baseUrl = "/api/students";
    let currentPage = 0;
    let pageSize = 10;
    let totalPages = 1;
    let totalElements = 0;
    let currentSearch = "";

    function requireRole(role) {
      const token = localStorage.getItem("token");
      const storedRole = (localStorage.getItem("role") || "").toUpperCase();
      if (!token || storedRole !== role) {
        localStorage.clear();
        window.location.replace("index.html");
        return false;
      }
      return true;
    }

    function logout() {
      localStorage.clear();
      window.location.href = "index.html";
    }

    function authHeaders(json = false) {
      const headers = {
        Authorization: "Bearer " + localStorage.getItem("token")
      };
      if (json) headers["Content-Type"] = "application/json";
      return headers;
    }

    function showMessage(text, type = "success") {
      const box = document.getElementById("messageBox");
      box.className = "rounded-lg p-4 text-sm";
      if (type === "success") {
        box.classList.add("bg-green-100", "text-green-800");
      } else {
        box.classList.add("bg-red-100", "text-red-800");
      }
      box.textContent = text;
      box.classList.remove("hidden");
    }

    function clearMessage() {
      const box = document.getElementById("messageBox");
      box.classList.add("hidden");
      box.textContent = "";
    }

    function getFormData() {
      return {
        name: document.getElementById("name").value.trim(),
        branch: document.getElementById("branch").value.trim(),
        year: document.getElementById("year").value ? Number(document.getElementById("year").value) : null,
        email: document.getElementById("email").value.trim(),
        cgpa: document.getElementById("cgpa").value ? Number(document.getElementById("cgpa").value) : null,
        phone: document.getElementById("phone").value.trim()
      };
    }

    function resetForm() {
      document.getElementById("studentId").value = "";
      document.getElementById("name").value = "";
      document.getElementById("branch").value = "";
      document.getElementById("year").value = "";
      document.getElementById("email").value = "";
      document.getElementById("cgpa").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("saveBtn").textContent = "Add Student";
    }

    function fillFormForEdit(student) {
      document.getElementById("studentId").value = student.id || "";
      document.getElementById("name").value = student.name || "";
      document.getElementById("branch").value = student.branch || "";
      document.getElementById("year").value = student.year ?? "";
      document.getElementById("email").value = student.email || "";
      document.getElementById("cgpa").value = student.cgpa ?? "";
      document.getElementById("phone").value = student.phone || "";
      document.getElementById("saveBtn").textContent = "Update Student";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function saveStudent() {
      clearMessage();
      const studentId = document.getElementById("studentId").value.trim();
      const payload = getFormData();

      try {
        let response;
        if (studentId) {
          response = await fetch(`${baseUrl}/${studentId}`, {
            method: "PUT",
            headers: authHeaders(true),
            body: JSON.stringify(payload)
          });
        } else {
          response = await fetch(baseUrl, {
            method: "POST",
            headers: authHeaders(true),
            body: JSON.stringify(payload)
          });
        }

        const data = await safeJson(response);
        if (!response.ok) throw new Error(extractError(data, "Operation failed"));

        showMessage(studentId ? "Student updated successfully" : "Student added successfully");
        resetForm();

        if (currentSearch) {
          await searchStudents();
        } else {
          await loadStudents();
        }
      } catch (err) {
        showMessage(err.message, "error");
      }
    }

    async function deleteStudent(id) {
      const confirmed = confirm("Are you sure you want to delete this student?");
      if (!confirmed) return;

      try {
        const response = await fetch(`${baseUrl}/${id}`, {
          method: "DELETE",
          headers: authHeaders()
        });

        if (!response.ok && response.status !== 204) {
          const data = await safeJson(response);
          throw new Error(extractError(data, "Failed to delete student"));
        }

        showMessage("Student deleted successfully");

        if (currentSearch) {
          await searchStudents();
        } else {
          if (currentPage > 0 && document.querySelectorAll("#studentTableBody tr").length === 1) {
            currentPage--;
          }
          await loadStudents();
        }
      } catch (err) {
        showMessage(err.message, "error");
      }
    }

    async function editStudent(id) {
      try {
        const response = await fetch(`${baseUrl}/${id}`, {
          headers: authHeaders()
        });
        const data = await safeJson(response);
        if (!response.ok) throw new Error(extractError(data, "Failed to fetch student"));
        fillFormForEdit(data);
      } catch (err) {
        showMessage(err.message, "error");
      }
    }

    async function loadStudents() {
      clearMessage();
      const response = await fetch(`${baseUrl}?page=${currentPage}&size=${pageSize}`, {
        headers: authHeaders()
      });
      const data = await safeJson(response);

      if (!response.ok) {
        showMessage(extractError(data, "Unable to fetch students"), "error");
        return;
      }

      const students = data.content || [];
      totalPages = data.totalPages || 1;
      totalElements = data.totalElements || 0;

      renderTable(students, true);
      updatePaginationInfo(students.length);
    }

    async function searchStudents() {
      clearMessage();
      const query = document.getElementById("searchInput").value.trim();
      currentSearch = query;

      if (!query) {
        currentPage = 0;
        loadStudents();
        return;
      }

      const response = await fetch(`${baseUrl}/search?name=${encodeURIComponent(query)}`, {
        headers: authHeaders()
      });
      const data = await safeJson(response);

      if (!response.ok) {
        showMessage(extractError(data, "Search failed"), "error");
        return;
      }

      const students = Array.isArray(data) ? data : [];
      renderTable(students, false);

      totalPages = 1;
      totalElements = students.length;

      document.getElementById("pageInfo").textContent = "Search results";
      document.getElementById("summaryText").textContent = `Showing ${students.length} result(s) for "${query}"`;
      document.getElementById("prevBtn").disabled = true;
      document.getElementById("nextBtn").disabled = true;
    }

    function clearSearch() {
      document.getElementById("searchInput").value = "";
      currentSearch = "";
      currentPage = 0;
      loadStudents();
    }

    function handleSearchEnter(event) {
      if (event.key === "Enter") {
        searchStudents();
      }
    }

    function renderTable(students, paginated) {
      const tbody = document.getElementById("studentTableBody");
      tbody.innerHTML = "";

      if (!students.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="px-6 py-8 text-center text-gray-500">
              No students found
            </td>
          </tr>
        `;
        return;
      }

      students.forEach((student, index) => {
        const serialNumber = paginated ? currentPage * pageSize + index + 1 : index + 1;
        const rowClass = index % 2 === 0 ? "bg-white" : "bg-gray-50";

        tbody.innerHTML += `
          <tr class="${rowClass} hover:bg-blue-50 transition">
            <td class="px-6 py-4">${serialNumber}</td>
            <td class="px-6 py-4 font-medium text-gray-800">${student.name ?? "-"}</td>
            <td class="px-6 py-4">${student.branch ?? "-"}</td>
            <td class="px-6 py-4">${student.year ?? "-"}</td>
            <td class="px-6 py-4">${student.email ?? "-"}</td>
            <td class="px-6 py-4">${student.cgpa ?? "-"}</td>
            <td class="px-6 py-4">
              <div class="flex gap-2">
                <button onclick="editStudent('${student.id}')" class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600">
                  Edit
                </button>
                <button onclick="deleteStudent('${student.id}')" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">
                  Delete
                </button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    function updatePaginationInfo(currentCount) {
      const start = totalElements === 0 ? 0 : currentPage * pageSize + 1;
      const end = totalElements === 0 ? 0 : start + currentCount - 1;

      document.getElementById("pageInfo").textContent = `Page ${currentPage + 1} of ${totalPages}`;
      document.getElementById("summaryText").textContent = `Showing ${start}-${end} of ${totalElements} students`;

      document.getElementById("prevBtn").disabled = currentPage === 0;
      document.getElementById("nextBtn").disabled = currentPage >= totalPages - 1;
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        loadStudents();
      }
    }

    function nextPage() {
      if (currentPage < totalPages - 1) {
        currentPage++;
        loadStudents();
      }
    }

    async function safeJson(response) {
      const text = await response.text();
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch {
        return text;
      }
    }

    function extractError(data, fallback) {
      if (!data) return fallback;
      if (typeof data === "string") return data;
      if (data.message) return data.message;
      if (data.error) return data.error;
      if (typeof data === "object") {
        const entries = Object.entries(data);
        if (entries.length) {
          return entries.map(([k, v]) => `${k}: ${v}`).join(", ");
        }
      }
      return fallback;
    }

    if (requireRole("ADMIN")) {
      document.getElementById("adminName").textContent = localStorage.getItem("username") || "Admin";
      loadStudents();
    }
  </script>
</body>
</html>
