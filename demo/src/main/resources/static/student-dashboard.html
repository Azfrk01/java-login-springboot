<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex bg-slate-100 min-h-screen">
<aside class="w-64 bg-slate-800 text-white flex flex-col p-5">
  <h2 class="text-2xl font-bold mb-8">Student Panel</h2>
  <nav class="flex flex-col gap-3 flex-1">
    <a href="student-dashboard.html" class="bg-slate-700 p-3 rounded hover:bg-slate-600 transition">Dashboard</a>
  </nav>
  <button onclick="logout()" class="bg-red-600 hover:bg-red-700 transition p-3 rounded mt-6">Logout</button>
</aside>

<div class="flex-1 flex flex-col">
  <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
    <h2 class="text-lg font-semibold">Student Dashboard</h2>
    <div class="font-medium text-slate-700">Welcome, <span id="username" class="text-blue-600"></span></div>
  </header>

  <main class="p-6 flex-1 space-y-6">
    <div class="bg-white p-6 rounded-lg shadow">
      <h1 class="text-2xl font-bold mb-2">Welcome <span id="welcomeUsername" class="text-blue-600"></span></h1>
      <p class="text-slate-600">You are logged in as a student. This dashboard is read-only and does not allow admin actions.</p>
    </div>

    <div class="bg-white p-6 rounded-lg shadow">
      <h3 class="text-lg font-semibold mb-4">Account Info</h3>
      <div class="space-y-2 text-slate-700">
        <p><span class="font-semibold">Username:</span> <span id="infoUsername"></span></p>
        <p><span class="font-semibold">Role:</span> STUDENT</p>
      </div>
    </div>

    <div class="bg-yellow-50 border border-yellow-200 p-6 rounded-lg shadow-sm">
      <h3 class="text-lg font-semibold mb-2 text-yellow-900">Access Notice</h3>
      <p class="text-yellow-800">Student accounts cannot add, edit, or delete student records from the frontend.</p>
    </div>
  </main>
</div>

<script>
function requireRole(role) {
  const token = localStorage.getItem('token');
  const storedRole = (localStorage.getItem('role') || '').toUpperCase();
  if (!token || storedRole !== role) {
    localStorage.clear();
    window.location.replace('index.html');
    return false;
  }
  return true;
}

function logout(){
  localStorage.clear();
  window.location.href = 'index.html';
}

if (requireRole('STUDENT')) {
  const username = localStorage.getItem('username') || 'Student';
  document.getElementById('username').innerText = username;
  document.getElementById('welcomeUsername').innerText = username;
  document.getElementById('infoUsername').innerText = username;
}
</script>
</body>
</html>
