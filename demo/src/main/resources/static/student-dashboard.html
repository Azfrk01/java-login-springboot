<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex bg-slate-100">

<script src="https://cdn.tailwindcss.com"></script>

<!-- Sidebar -->
<aside class="w-60 bg-slate-800 text-white min-h-screen p-4 flex flex-col">

<h2 class="text-xl font-bold mb-6">Student Panel</h2>

<nav class="flex flex-col gap-2 flex-1">

<a href="student-dashboard.html" class="bg-slate-700 p-2 rounded">
Dashboard
</a>

<a href="student.html" class="p-2 hover:bg-slate-700 rounded">
Students
</a>

<a href="#" class="p-2 hover:bg-slate-700 rounded">
Profile
</a>

</nav>

<button onclick="logout()" class="bg-red-600 p-2 rounded mt-4">
Logout
</button>

</aside>

<!-- Main -->
<div class="flex-1">

<!-- Navbar -->
<header class="bg-white shadow p-4 flex justify-between">

<h2 class="text-lg font-semibold">
Student Dashboard
</h2>

<div>

<span id="username"></span>

</div>

</header>

<!-- Content -->
<div class="p-6">

<h1 class="text-2xl font-bold mb-4">
Welcome <span id="welcomeUsername"></span>
</h1>

<div class="bg-white p-6 rounded shadow">

Dashboard content here

</div>

</div>

</div>

<script>

if (!localStorage.getItem("token")) {
  window.location.href = "index.html";
}

document.getElementById("username").innerText =
  localStorage.getItem("username");

document.getElementById("welcomeUsername").innerText =
  localStorage.getItem("username");

function logout(){
  localStorage.clear();
  window.location.href = "index.html";
}

</script>

</body></html>
