<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body{font-family:'DM Sans',sans-serif;margin:0;}
    .syne{font-family:'Syne',sans-serif;}
    .grain{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");opacity:0.5;}
    .card{background:#1c1917;border:1px solid #292524;border-radius:16px;padding:22px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;color:#a8a29e;font-size:.875rem;font-weight:500;cursor:pointer;transition:background .18s,color .18s;font-family:'DM Sans',sans-serif;text-decoration:none;}
    .nav-item:hover{background:#1c1917;color:#e7e5e4;}.nav-item.active{background:#f97316;color:#fff;}
    .btn-primary{background:#f97316;color:#fff;font-family:'Syne',sans-serif;font-weight:600;border-radius:12px;padding:10px 20px;font-size:.875rem;transition:transform .15s,box-shadow .15s,background .2s;cursor:pointer;border:none;}
    .btn-primary:hover{background:#ea6c0a;transform:translateY(-1px);box-shadow:0 6px 20px rgba(249,115,22,.3);}
    .btn-ghost{background:transparent;color:#a8a29e;font-family:'Syne',sans-serif;font-weight:600;border-radius:12px;padding:10px 20px;font-size:.875rem;border:1px solid #292524;transition:background .18s,color .18s;cursor:pointer;}
    .btn-ghost:hover{background:#1c1917;color:#e7e5e4;}
  </style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen flex relative overflow-x-hidden">
<div class="grain"></div>
<aside class="w-56 min-h-screen bg-stone-900 border-r border-stone-800 flex flex-col py-6 px-3 gap-1 z-10 flex-shrink-0">
  <div class="flex items-center gap-3 px-3 mb-6">
    <div class="w-9 h-9 bg-orange-500 rounded-xl flex items-center justify-center flex-shrink-0">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
    </div>
    <span class="syne text-white font-bold text-lg tracking-tight">EduPanel</span>
  </div>
  <nav class="flex flex-col gap-1 flex-1">
    <a href="admin-dashboard.html" class="nav-item active">Dashboard</a>
    <a href="student.html" class="nav-item">Manage Students</a>
  </nav>
  <button onclick="logout()" class="nav-item w-full text-left text-red-400 hover:bg-red-500/10 hover:text-red-300 mt-2">Logout</button>
</aside>

<main class="flex-1 flex flex-col min-w-0 relative z-10">
  <header class="sticky top-0 z-20 bg-stone-950/80 backdrop-blur border-b border-stone-800/60 px-6 py-4 flex items-center gap-4">
    <div class="flex-1">
      <h2 class="syne text-white font-bold text-lg leading-tight">Admin Dashboard</h2>
      <p class="text-stone-500 text-xs">Overview of students and activity</p>
    </div>
    <div class="text-right">
      <p id="navUsername" class="text-white text-sm font-semibold syne"></p>
      <p class="text-stone-500 text-xs">Administrator</p>
    </div>
  </header>

  <div class="p-6 space-y-6 overflow-y-auto">
    <div class="card flex items-center justify-between">
      <div>
        <p class="text-stone-400 text-sm">Welcome back,</p>
        <h3 class="syne text-white text-xl font-bold mt-0.5"><span id="welcomeUsername"></span> 👋</h3>
      </div>
      <button onclick="window.location.href='student.html'" class="btn-primary">Open Student Management</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      <div class="card"><p class="text-stone-400 text-sm">Total Students</p><h2 id="totalStudents" class="text-3xl font-bold mt-2">0</h2></div>
      <div class="card"><p class="text-stone-400 text-sm">Average CGPA</p><h2 id="avgCgpa" class="text-3xl font-bold mt-2">0.00</h2></div>
      <div class="card"><p class="text-stone-400 text-sm">Branches</p><h2 id="branchCount" class="text-3xl font-bold mt-2">0</h2></div>
      <div class="card"><p class="text-stone-400 text-sm">Years Covered</p><h2 id="yearCount" class="text-3xl font-bold mt-2">0</h2></div>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
      <div class="card">
        <div class="flex items-center justify-between mb-4">
          <h3 class="syne text-white text-lg font-bold">Branch Breakdown</h3>
          <span class="text-stone-500 text-xs">Current database</span>
        </div>
        <div id="branchBreakdown" class="space-y-4 text-sm text-stone-300"></div>
      </div>

      <div class="card">
        <div class="flex items-center justify-between mb-4">
          <h3 class="syne text-white text-lg font-bold">Recent Students</h3>
          <button onclick="loadRecentStudents()" class="btn-ghost">Refresh</button>
        </div>
        <div id="recentStudents" class="space-y-3 text-sm text-stone-300"></div>
      </div>
    </div>
  </div>
</main>
<script>
function requireRole(role){
  const token = localStorage.getItem('token');
  const storedRole = (localStorage.getItem('role') || '').toUpperCase();
  if (!token || storedRole !== role) {
    localStorage.clear();
    window.location.replace('index.html');
    return false;
  }
  return true;
}
function authHeaders(){
  return {
    'Authorization': 'Bearer ' + localStorage.getItem('token')
  };
}
function logout(){
  localStorage.clear();
  window.location.href = 'index.html';
}
function setIdentity(){
  const username = localStorage.getItem('username') || 'Admin';
  document.getElementById('navUsername').innerText = username;
  document.getElementById('welcomeUsername').innerText = username;
}
async function loadStats(){
  try{
    const res = await fetch('/students/stats', { headers: authHeaders() });
    if (res.status === 401 || res.status === 403) throw new Error('Unauthorized');
    if (!res.ok) throw new Error('Failed to load stats');
    const data = await res.json();
    const totalStudents = data.totalStudents ?? 0;
    const averageCgpa = Number(data.averageCgpa ?? 0).toFixed(2);
    const branchCounts = data.branchCounts || data.branchStats || {};
    const yearCounts = data.yearCounts || {};
    document.getElementById('totalStudents').innerText = totalStudents;
    document.getElementById('avgCgpa').innerText = averageCgpa;
    document.getElementById('branchCount').innerText = Object.keys(branchCounts).length;
    document.getElementById('yearCount').innerText = Object.keys(yearCounts).length;
    renderBranchBreakdown(branchCounts, totalStudents);
  } catch (err) {
    document.getElementById('branchBreakdown').innerHTML = '<p class="text-red-400">Unable to load stats.</p>';
  }
}
function renderBranchBreakdown(branchCounts, totalStudents){
  const container = document.getElementById('branchBreakdown');
  const entries = Object.entries(branchCounts);
  if (!entries.length) {
    container.innerHTML = '<p class="text-stone-500">No branch data available.</p>';
    return;
  }
  container.innerHTML = entries.map(([branch, count]) => {
    const percent = totalStudents ? Math.round((count / totalStudents) * 100) : 0;
    return `
      <div>
        <div class="flex justify-between mb-1"><span>${branch}</span><span>${count}</span></div>
        <div class="w-full bg-stone-800 h-3 rounded-full overflow-hidden">
          <div class="bg-orange-500 h-3" style="width:${percent}%"></div>
        </div>
      </div>`;
  }).join('');
}

async function loadRecentStudents() {
  const container = document.getElementById('recentStudents');
  container.innerHTML = '<p class="text-stone-500">Loading...</p>';
  try {
    const res = await fetch('/students?page=0&size=5&sort=id,desc', { headers: authHeaders() });
    if (!res.ok) throw new Error('Failed to load students');
    const data = await res.json();
    const students = Array.isArray(data.content) ? data.content : (Array.isArray(data) ? data : []);
    if (!students.length) {
      container.innerHTML = '<p class="text-stone-500">No students found.</p>';
      return;
    }
    container.innerHTML = students.map(student => `
      <div class="border border-stone-800 rounded-xl p-4 bg-stone-950/40 flex items-center justify-between gap-4">
        <div>
          <p class="text-white font-semibold">${student.name || 'Unnamed'}</p>
          <p class="text-stone-400 text-xs">${student.branch || '-'} • Year ${student.year ?? '-'}</p>
        </div>
        <div class="text-right">
          <p class="text-stone-300 text-xs">CGPA ${student.cgpa ?? '-'}</p>
          <p class="text-stone-500 text-xs">${student.id || ''}</p>
        </div>
      </div>`).join('');
  } catch (err) {
    container.innerHTML = '<p class="text-red-400">Unable to load recent students.</p>';
  }
}
if(requireRole('ADMIN')){
  setIdentity();
  loadStats();
  loadRecentStudents();
}
</script>
</body>
</html>
