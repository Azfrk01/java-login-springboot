<!DOCTYPE html>
<html>
<head>
  <title>Student Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'DM Sans', sans-serif; margin: 0; }
    .syne { font-family: 'Syne', sans-serif; }

    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.5;
    }

    .card {
      animation: slideUp 0.55s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .input-field {
      width: 100%;
      background: #1c1917;
      border: 1px solid #292524;
      border-radius: 12px;
      padding: 11px 14px;
      color: #e7e5e4;
      font-size: 0.875rem;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      box-sizing: border-box;
    }
    .input-field::placeholder { color: #57534e; }
    .input-field:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249,115,22,0.15);
    }

    /* hide number input arrows */
    .input-field[type=number]::-webkit-inner-spin-button,
    .input-field[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .input-field[type=number] { -moz-appearance: textfield; }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s, color 0.2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: #f97316;
      color: #fff;
    }
    .btn-primary:hover {
      background: #ea6c0a;
      box-shadow: 0 6px 18px rgba(249,115,22,0.3);
    }

    .btn-ghost {
      background: #1c1917;
      color: #a8a29e;
      border: 1px solid #292524;
    }
    .btn-ghost:hover { background: #292524; color: #e7e5e4; }

    .btn-danger {
      background: rgba(239,68,68,0.1);
      color: #f87171;
      border: 1px solid rgba(239,68,68,0.2);
    }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }

    .btn-back {
      background: #292524;
      color: #a8a29e;
    }
    .btn-back:hover { background: #3c3836; color: #e7e5e4; }

    #result {
      margin-top: 0;
      background: #1c1917;
      border: 1px solid #292524;
      border-radius: 12px;
      padding: 14px;
      min-height: 48px;
      white-space: pre-wrap;
      font-size: 0.8rem;
      color: #a8a29e;
      font-family: 'DM Sans', monospace;
      line-height: 1.6;
    }
  </style>
</head>
<body class="min-h-screen bg-stone-950 flex items-start justify-center px-4 py-12 relative overflow-x-hidden">

  <div class="grain"></div>

  <!-- Background glow -->
  <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-orange-500 rounded-full blur-[140px] opacity-10 pointer-events-none"></div>

  <!-- Card -->
  <div class="card relative z-10 w-full max-w-md bg-stone-900 border border-stone-800 rounded-2xl shadow-2xl overflow-hidden">

    <!-- Header -->
    <div class="px-6 py-5 border-b border-stone-800 flex items-center gap-3">
      <div class="w-9 h-9 bg-orange-500 rounded-xl flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <div>
        <h2 class="syne text-white font-bold text-lg leading-tight">Student Management</h2>
        <p class="text-stone-500 text-xs">Add, view or remove students</p>
      </div>
    </div>

    <!-- Form -->
    <div class="px-6 py-5 space-y-3">

      <div>
        <label class="block text-stone-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">Student ID</label>
        <input type="text" id="id" placeholder="Enter student ID" class="input-field" required>
      </div>

      <div>
        <label class="block text-stone-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">Full Name</label>
        <input type="text" id="name" placeholder="Enter full name" class="input-field" required>
      </div>
      
      <div>
        <label class="block text-stone-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">Branch</label>
        <input type="text" id="branch" placeholder="e.g. Computer Science" class="input-field" required>
      </div>

      <div>
        <label class="block text-stone-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">CGPA</label>
        <input type="text" id="cgpa" placeholder="e.g. 8.5" class="input-field" required>
      </div>

      <div>
        <label class="block text-stone-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">Year</label>
        <input type="number" id="year" min="1" max="4" placeholder="1 – 4" class="input-field" required>
      </div>
      <div>
        <label class="block text-stone-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">Email</label>
        <input type="email" id="email" placeholder="Enter email address" class="input-field" required>
      </div>
      <div>
        <label class="block text-stone-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">Phone</label>
        <input type="tel" id="phone" placeholder="Enter phone number" class="input-field" required>
      <!-- Action Buttons -->
      <div class="pt-1 flex flex-wrap gap-2">
        <button class="btn btn-primary" onclick="addStudent()">
          Add Student
        </button>
        <button class="btn btn-ghost" onclick="getStudents()">
          Get All
        </button>
        <button class="btn btn-ghost" onclick="getById()">
          Get By ID
        </button>
        <button class="btn btn-danger" onclick="deleteStudent()">
          Delete
        </button>
        <button class="btn btn-back" onclick="goBack()">
          ← Back
        </button>
      </div>

      <!-- Result -->
      <div>
        <label class="block text-stone-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">Result</label>
        <div id="result">Output will appear here...</div>
      </div>

    </div>
  </div>

<script>
const baseUrl = "/students";
function getToken(){
  var token = localStorage.getItem("token");
  if (token == null) {
    return null;
  }
  return "Bearer " + token;
}
function clearFields(){
  document.getElementById("id").value = "";
  document.getElementById("name").value = "";
  document.getElementById("branch").value = "";
  document.getElementById("year").value = "";
  document.getElementById("cgpa").value = "";
  document.getElementById("email").value = "";
  document.getElementById("phone").value = "";
}
function addStudent(){
  var token = getToken();
  if (token == null) {
    document.getElementById("result").innerText = "Please login first.";
    return;
  }
  var student ={
    id: document.getElementById("id").value,
    name: document.getElementById("name").value,
    branch: document.getElementById("branch").value,
    year: document.getElementById("year").value,
    cgpa: document.getElementById("cgpa").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value
  };
  fetch(baseUrl,{
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify(student)
  })
  .then(function(response) {
    if (response.status == 200 || response.status == 201) {
      return response.json();
    } else {
      throw "Error";
    }
  })
  .then(function(data) {
    document.getElementById("result").innerText ="Student added successfully:\n" +
      JSON.stringify(data, null, 2);
    clearFields();
  })
  .catch(function() {
    document.getElementById("result").innerText ="Something went wrong while adding student.";
  });
}
function getStudents(){
  var token = getToken();
  if (token == null) {
    document.getElementById("result").innerText = "Please login first.";
    return;
  }
  fetch(baseUrl,{
    method: "GET",
    headers: {
      "Authorization": token
    }
  })
  .then(function(response){
    if (response.status == 200){
      return response.json();
    } else {
      throw "Error";
    }
  })
  .then(function(data){
    document.getElementById("result").innerText =JSON.stringify(data, null, 2);
  })
  .catch(function(){
    document.getElementById("result").innerText ="Unable to fetch students.";
  });
}
function getById(){
  var id = document.getElementById("id").value;
  var token = getToken();
  if(id==""){
    document.getElementById("result").innerText = "Enter ID first.";
    return;
  }
  if (token==null){
    document.getElementById("result").innerText = "Please login first.";
    return;
  }
  fetch(baseUrl + "/" + id,{
    method: "GET",
    headers: {
      "Authorization": token
    }
  })
  .then(function(response){
    if (response.status == 200){
      return response.json();
    }else{
      throw "Not Found";
    }
  })
  .then(function(data){
    document.getElementById("result").innerText =JSON.stringify(data, null, 2);
  })
  .catch(function(){
    document.getElementById("result").innerText ="Student not found or unauthorized.";
  });
}
function deleteStudent(){
  var id = document.getElementById("id").value;
  var token = getToken();
  if(id==""){
    document.getElementById("result").innerText = "Enter ID to delete.";
    return;
  }
  if(token==null){
    document.getElementById("result").innerText = "Please login first.";
    return;
  }
  fetch(baseUrl+"/"+id,{
    method: "DELETE",
    headers: {
      "Authorization": token
    }
  })
  .then(function(response){
    if (response.status == 204){
      document.getElementById("result").innerText ="Student deleted successfully.";
      clearFields();
    }
    else if (response.status == 401 || response.status == 403){
      document.getElementById("result").innerText ="Unauthorized. Login again.";
    }
    else{
      document.getElementById("result").innerText ="Student not found.";
    }
  })
  .catch(function(){
    document.getElementById("result").innerText ="Error while deleting student.";
  });
}
function goBack(){
  window.location.href = "dashboard.html";
}
</script>
</body>
</html>
