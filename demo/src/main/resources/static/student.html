<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management | Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body{font-family:'DM Sans',sans-serif;margin:0;background:#09090b;color:#e7e5e4;}
    .syne{font-family:'Syne',sans-serif;}
    .panel{background:#18181b;border:1px solid #27272a;border-radius:16px;}
    .input-field{width:100%;background:#0f0f12;border:1px solid #27272a;border-radius:12px;padding:11px 14px;color:#e7e5e4;font-size:.875rem;outline:none;box-sizing:border-box;}
    .input-field:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.15);}
    .btn{padding:10px 18px;border:none;border-radius:12px;cursor:pointer;font-family:'Syne',sans-serif;font-weight:600;font-size:.8rem;transition:transform .15s,box-shadow .15s,background .2s,color .2s;}
    .btn:hover{transform:translateY(-1px);} .btn-primary{background:#f97316;color:#fff;} .btn-primary:hover{background:#ea6c0a;box-shadow:0 6px 18px rgba(249,115,22,.3);} .btn-ghost{background:#18181b;color:#d4d4d8;border:1px solid #3f3f46;} .btn-danger{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2);} 
    pre{white-space:pre-wrap;word-break:break-word;}
  </style>
</head>
<body>
<div class="min-h-screen flex">
  <aside class="w-64 bg-zinc-900 border-r border-zinc-800 text-white flex flex-col p-5">
    <h2 class="text-2xl font-bold mb-8 syne">Admin Panel</h2>
    <nav class="flex flex-col gap-3 flex-1">
      <a href="admin-dashboard.html" class="p-3 rounded hover:bg-zinc-800 transition">Dashboard</a>
      <a href="student.html" class="bg-zinc-800 p-3 rounded transition">Manage Students</a>
    </nav>
    <button onclick="logout()" class="bg-red-600 hover:bg-red-700 transition p-3 rounded mt-6">Logout</button>
  </aside>

  <main class="flex-1 p-6 space-y-6">
    <div class="panel p-6 flex items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold syne">Student Management</h1>
        <p class="text-zinc-400 text-sm mt-1">Admin-only page for create, read, update and delete operations.</p>
      </div>
      <div class="text-right text-sm text-zinc-300">
        <div class="font-semibold">Logged in as</div>
        <div id="adminName" class="text-orange-400"></div>
      </div>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
      <div class="panel p-6 space-y-4">
        <h3 class="text-lg font-semibold syne">Student Form</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-zinc-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">Student ID</label>
            <input type="text" id="id" placeholder="Required for get, update, delete" class="input-field">
          </div>
          <div>
            <label class="block text-zinc-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">Full Name</label>
            <input type="text" id="name" placeholder="Enter full name" class="input-field">
          </div>
          <div>
            <label class="block text-zinc-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">Branch</label>
            <input type="text" id="branch" placeholder="Computer Science" class="input-field">
          </div>
          <div>
            <label class="block text-zinc-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">Year</label>
            <input type="number" id="year" min="1" max="4" placeholder="1 - 4" class="input-field">
          </div>
          <div>
            <label class="block text-zinc-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">CGPA</label>
            <input type="number" id="cgpa" min="0" max="10" step="0.01" placeholder="8.50" class="input-field">
          </div>
          <div>
            <label class="block text-zinc-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">Email</label>
            <input type="email" id="email" placeholder="student@example.com" class="input-field">
          </div>
          <div class="md:col-span-2">
            <label class="block text-zinc-400 text-xs syne font-semibold uppercase tracking-widest mb-1.5">Phone</label>
            <input type="tel" id="phone" placeholder="Enter phone number" class="input-field">
          </div>
        </div>

        <div class="flex flex-wrap gap-2 pt-2">
          <button class="btn btn-primary" onclick="addStudent()">Add</button>
          <button class="btn btn-primary" onclick="updateStudent()">Update</button>
          <button class="btn btn-ghost" onclick="getStudents()">Get All</button>
          <button class="btn btn-ghost" onclick="getById()">Get By ID</button>
          <button class="btn btn-danger" onclick="deleteStudent()">Delete</button>
          <button class="btn btn-ghost" onclick="window.location.href='admin-dashboard.html'">Back</button>
        </div>
      </div>

      <div class="panel p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold syne">Result</h3>
          <button class="btn btn-ghost" onclick="clearResult()">Clear</button>
        </div>
        <pre id="result" class="text-sm text-zinc-300 min-h-[460px]">Output will appear here...</pre>
      </div>
    </div>
  </main>
</div>

<script>
function requireRole(role) {
  const token = localStorage.getItem('token');
  const storedRole = (localStorage.getItem('role') || '').toUpperCase();
  if (!token || storedRole !== role) {
    localStorage.clear();
    window.location.replace('index.html');
    return false;
  }
  return true;
}

const baseUrl = "/api/students";

function getToken() {
  const token = localStorage.getItem('token');
  return token ? 'Bearer ' + token : null;
}

function authHeaders(json = false) {
  const headers = { 'Authorization': getToken() };
  if (json) headers['Content-Type'] = 'application/json';
  return headers;
}

function showResult(value) {
  document.getElementById('result').innerText = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
}

function clearResult() {
  showResult('Output will appear here...');
}

function logout() {
  localStorage.clear();
  window.location.href = 'index.html';
}

function clearFields() {
  ['id','name','branch','year','cgpa','email','phone'].forEach(id => document.getElementById(id).value = '');
}

function collectStudentPayload() {
  return {
    name: document.getElementById('name').value.trim(),
    branch: document.getElementById('branch').value.trim(),
    year: document.getElementById('year').value ? Number(document.getElementById('year').value) : null,
    cgpa: document.getElementById('cgpa').value ? Number(document.getElementById('cgpa').value) : null,
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim()
  };
}

async function addStudent() {
  const student = collectStudentPayload();
  try {
    const response = await fetch(baseUrl, {
      method: 'POST',
      headers: authHeaders(true),
      body: JSON.stringify(student)
    });
    const data = await safeJson(response);
    if (!response.ok) throw new Error(extractError(data, 'Failed to add student.'));
    showResult(data);
    clearFields();
  } catch (err) {
    showResult(err.message);
  }
}

async function updateStudent() {
  const id = document.getElementById('id').value.trim();
  if (!id) return showResult('Enter student ID first.');
  const student = collectStudentPayload();
  try {
    const response = await fetch(baseUrl + '/' + id, {
      method: 'PUT',
      headers: authHeaders(true),
      body: JSON.stringify(student)
    });
    const data = await safeJson(response);
    if (!response.ok) throw new Error(extractError(data, 'Failed to update student.'));
    showResult(data);
  } catch (err) {
    showResult(err.message);
  }
}

async function getStudents() {
  try {
    const response = await fetch(baseUrl, { headers: authHeaders() });
    const data = await safeJson(response);
    if (!response.ok) throw new Error(extractError(data, 'Unable to fetch students.'));
    showResult(data);
  } catch (err) {
    showResult(err.message);
  }
}

async function getById() {
  const id = document.getElementById('id').value.trim();
  if (!id) return showResult('Enter ID first.');
  try {
    const response = await fetch(baseUrl + '/' + id, { headers: authHeaders() });
    const data = await safeJson(response);
    if (!response.ok) throw new Error(extractError(data, 'Student not found.'));
    showResult(data);
  } catch (err) {
    showResult(err.message);
  }
}

async function deleteStudent() {
  const id = document.getElementById('id').value.trim();
  if (!id) return showResult('Enter ID to delete.');
  try {
    const response = await fetch(baseUrl + '/' + id, {
      method: 'DELETE',
      headers: authHeaders()
    });
    if (response.status === 204) {
      showResult('Student deleted successfully.');
      clearFields();
      return;
    }
    const data = await safeJson(response);
    throw new Error(extractError(data, 'Failed to delete student.'));
  } catch (err) {
    showResult(err.message);
  }
}
async function safeJson(response) {
  const text = await response.text();
  if (!text) return {};
  try {
    return JSON.parse(text);
  } catch (_) {
    return text;
  }
}
 function extractError(data, fallback) {
  if (!data) return fallback;

  if (typeof data === 'string') {
    return data;
  }

  if (data.message) {
    return data.message;
  }

  if (data.error) {
    return data.error;
  }

  if (typeof data === 'object') {
    const entries = Object.entries(data);
    if (entries.length) {
      return entries.map(([key, value]) => `${key}: ${value}`).join('\n');
    }
  }

  return fallback;
}

if (requireRole('ADMIN')) {
  document.getElementById('adminName').innerText = localStorage.getItem('username') || 'Admin';
}
</script>
</body>
</html>
