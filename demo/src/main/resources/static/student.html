<!DOCTYPE html>
<html>
<head>
  <title>Student Management</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }
    .card {
      background: white;
      padding: 30px;
      width: 500px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 15px;
      margin: 5px 5px 5px 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #007bff;
      color: white;
    }
    button:hover{
      background: #0056b3;
    }
    #result{
      margin-top: 15px;
      background: #f1f1f1;
      padding: 10px;
      border-radius: 6px;
      min-height: 40px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
<div class="card">
  <h2>Student Management</h2>
  <input type="text" id="id" placeholder="ID">
  <input type="text" id="name" placeholder="Name">
  <input type="text" id="branch" placeholder="Branch">
  <input type="number" id="year" placeholder="Year">
  <div>
    <button onclick="addStudent()">Add</button>
    <button onclick="getStudents()">Get All</button>
    <button onclick="getById()">Get By ID</button>
    <button onclick="deleteStudent()">Delete</button>
    <button onclick="goBack()">Back</button>
  </div>
  <div id="result"></div>
</div>
<script>
const baseUrl = "http://localhost:8080/students";
function getToken(){
  var token = localStorage.getItem("token");
  if (token == null) {
    return null;
  }
  return "Bearer " + token;
}
function clearFields(){
  document.getElementById("id").value = "";
  document.getElementById("name").value = "";
  document.getElementById("branch").value = "";
  document.getElementById("year").value = "";
}
function addStudent(){
  var token = getToken();
  if (token == null) {
    document.getElementById("result").innerText = "Please login first.";
    return;
  }
  var student ={
    id: document.getElementById("id").value,
    name: document.getElementById("name").value,
    branch: document.getElementById("branch").value,
    year: document.getElementById("year").value
  };
  fetch(baseUrl,{
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify(student)
  })
  .then(function(response) {
    if (response.status == 200 || response.status == 201) {
      return response.json();
    } else {
      throw "Error";
    }
  })
  .then(function(data) {
    document.getElementById("result").innerText ="Student added successfully:\n" +
      JSON.stringify(data, null, 2);
    clearFields();
  })
  .catch(function() {
    document.getElementById("result").innerText ="Something went wrong while adding student.";
  });
}
function getStudents(){
  var token = getToken();
  if (token == null) {
    document.getElementById("result").innerText = "Please login first.";
    return;
  }
  fetch(baseUrl,{
    method: "GET",
    headers: {
      "Authorization": token
    }
  })
  .then(function(response){
    if (response.status == 200){
      return response.json();
    } else {
      throw "Error";
    }
  })
  .then(function(data){
    document.getElementById("result").innerText =JSON.stringify(data, null, 2);
  })
  .catch(function(){
    document.getElementById("result").innerText ="Unable to fetch students.";
  });
}
function getById(){
  var id = document.getElementById("id").value;
  var token = getToken();
  if(id==""){
    document.getElementById("result").innerText = "Enter ID first.";
    return;
  }
  if (token==null){
    document.getElementById("result").innerText = "Please login first.";
    return;
  }
  fetch(baseUrl + "/" + id,{
    method: "GET",
    headers: {
      "Authorization": token
    }
  })
  .then(function(response){
    if (response.status == 200){
      return response.json();
    }else{
      throw "Not Found";
    }
  })
  .then(function(data){
    document.getElementById("result").innerText =JSON.stringify(data, null, 2);
  })
  .catch(function(){
    document.getElementById("result").innerText ="Student not found or unauthorized.";
  });
}
function deleteStudent(){
  var id = document.getElementById("id").value;
  var token = getToken();
  if(id==""){
    document.getElementById("result").innerText = "Enter ID to delete.";
    return;
  }
  if(token==null){
    document.getElementById("result").innerText = "Please login first.";
    return;
  }
  fetch(baseUrl+"/"+id,{
    method: "DELETE",
    headers: {
      "Authorization": token
    }
  })
  .then(function(response){
    if (response.status == 204){
      document.getElementById("result").innerText ="Student deleted successfully.";
      clearFields();
    }
    else if (response.status == 401 || response.status == 403){
      document.getElementById("result").innerText ="Unauthorized. Login again.";
    }
    else{
      document.getElementById("result").innerText ="Student not found.";
    }
  })
  .catch(function(){
    document.getElementById("result").innerText ="Error while deleting student.";
  });
}
function goBack(){
  window.location.href = "dashboard.html";
}
</script>
</body>
</html>
